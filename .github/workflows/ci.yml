name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and Git integration tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q main.py harness_updater scripts

  windows-package:
    name: Windows package
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Build EXE, ZIP, and checksums
        shell: pwsh
        run: .\build.ps1
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: HarnessUpdater-Windows-x64-ci
          path: |
            dist/HarnessUpdater.exe
            dist/HarnessUpdater-*-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
